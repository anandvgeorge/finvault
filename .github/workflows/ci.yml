name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install project Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -v

  promote-production:
    name: Promote production
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: finvault-production-promotion
      cancel-in-progress: false

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update production branch
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Skipping promotion: main has a newer commit."
            exit 0
          fi

          # A normal push creates the branch or moves it forward; never force it.
          git push origin "${GITHUB_SHA}:refs/heads/production"
          echo "Promoted tested commit ${GITHUB_SHA} to production."
