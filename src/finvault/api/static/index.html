<!DOCTYPE html>

<html>
<head>
    <title>FinVault</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .period-selector {
        margin: 20px 0 30px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
    }

    .card {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
    }

    .card h3 {
        margin-top: 0;
    }

    .card p {
        font-size: 24px;
        font-weight: bold;
    }

    .transactions {
        margin-top: 50px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th,
    td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        font-weight: bold;
    }

    select {
        padding: 6px;
    }
</style>

</head>

<body>
    <h1>FinVault</h1>

<h2>Overview</h2>

<div class="period-selector">
    <select id="period">
        <option value="month">This Month</option>
        <option value="year">This Year</option>
        <option value="all">All Time</option>
    </select>
</div>

<div class="cards">
    <div class="card">
        <h3>Debits</h3>
        <p id="total-debits">-</p>
    </div>

    <div class="card">
        <h3>Credits</h3>
        <p id="total-credits">-</p>
    </div>

    <div class="card">
        <h3>Net Cashflow</h3>
        <p id="net-cashflow">-</p>
    </div>

    <div class="card">
        <h3>UPI Debits</h3>
        <p id="upi-debits">-</p>
    </div>

    <div class="card">
        <h3>Credit Card Debits</h3>
        <p id="credit-card-debits">-</p>
    </div>
</div>

<div class="transactions">
    <h2>Transactions</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Source</th>
                <th>Category</th>
            </tr>
        </thead>

        <tbody id="transactions-body">
        </tbody>
    </table>
</div>

<script>
    async function loadOverview() {
        const period = document.getElementById("period").value;

        const response = await fetch(`/overview?period=${period}`);
        const data = await response.json();

        document.getElementById("total-debits").textContent =
            `₹${data.total_debits.toLocaleString("en-IN")}`;

        document.getElementById("total-credits").textContent =
            `₹${data.total_credits.toLocaleString("en-IN")}`;

        document.getElementById("net-cashflow").textContent =
            `₹${data.net_cashflow.toLocaleString("en-IN")}`;

        document.getElementById("upi-debits").textContent =
            `₹${data.upi_debits.toLocaleString("en-IN")}`;

        document.getElementById("credit-card-debits").textContent =
            `₹${data.credit_card_debits.toLocaleString("en-IN")}`;
    }

    async function loadTransactions() {
        const response = await fetch("/transactions");
        const transactions = await response.json();

        const tbody = document.getElementById("transactions-body");

        tbody.innerHTML = "";

        for (const transaction of transactions) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${transaction.transaction_date.slice(0, 10)}</td>
                <td>${transaction.merchant}</td>
                <td>₹${Number(transaction.amount).toLocaleString("en-IN")}</td>
                <td>${transaction.transaction_type}</td>
                <td>${transaction.source}</td>
                <td>
                    <select>
                        <option value="">Uncategorized</option>
                        <option value="necessary">Necessary</option>
                        <option value="lifestyle">Lifestyle</option>
                        <option value="investment">Investment</option>
                        <option value="salary">Salary</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            `;

            tbody.appendChild(row);
        }
    }

    document.getElementById("period").addEventListener(
        "change",
        loadOverview
    );

    loadOverview();
    loadTransactions();
</script>

</body>
</html>
