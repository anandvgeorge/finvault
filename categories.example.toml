# Copy to categories.toml in your working directory; the real file is ignored.
# Pi working directory: ~/.local/share/finvault
# IDs are stored in SQLite. Keep IDs stable when changing display labels.

# Select the main category whose credits count as income for analysis.
income_group = "income"

[categories]
necessary = "Necessary"
lifestyle = "Lifestyle"
eat_out = "Eat out"
investment = "Investment"
salary = "Salary"
lend = "Lend"
other = "Other"
refunds = "Refunds"

# Main categories are configurable; existing files can omit both sections.
[groups]
necessary = "Necessary"
lifestyle = "Lifestyle"
investments = "Investments"
income = "Income"

# Each existing category can belong to one main category.
# Omitted categories (lend, refunds, other) remain independent categories.
[category_groups]
necessary = "necessary"
lifestyle = "lifestyle"
eat_out = "lifestyle"
investment = "investments"
salary = "income"

# Rules apply to newly parsed transactions during ingestion.
# Match body text only, ignoring case and repeated whitespace.
# Any keyword can match as a literal substring; the first matching rule wins.
# Omit transaction_type to allow either debit or credit.
# Use fictional examples here. Put personal keywords only in categories.toml.
# [[rules]]
# category = "salary"
# transaction_type = "credit"
# keywords = ["example employer", "payroll"]
